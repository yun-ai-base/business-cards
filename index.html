<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f4ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238B6A3F'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Georgia,serif' font-weight='700' fill='%23FFF8EC' text-anchor='middle'%3EBC%3C/text%3E%3C/svg%3E">
<title>名片信息档案 · 访问验证</title>
<style>
  :root{
    --bg:#f7f4ef; --panel:#fffdf9; --ink:#1b2530; --ink2:#5c6673; --ink3:#98a0aa;
    --gold:#8B6A3F; --gold-soft:#c9a97a; --line:#e6dfd3; --danger:#b4472f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background-image:
      radial-gradient(900px 520px at 50% -10%, #fff8ec 0%, rgba(255,248,236,0) 70%),
      repeating-linear-gradient(45deg, rgba(139,106,63,.028) 0 1px, transparent 1px 9px);
  }
  .box{width:100%; max-width:392px}
  .brand{
    display:flex; align-items:center; gap:9px; justify-content:center;
    font-size:12px; letter-spacing:.16em; color:var(--gold); font-weight:700;
    text-transform:uppercase; margin-bottom:22px; opacity:.9;
  }
  .brand i{width:6px; height:6px; border-radius:50%; background:var(--gold-soft); display:block}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:36px 30px 28px; text-align:center;
    box-shadow:0 1px 0 #fff inset, 0 18px 40px -22px rgba(60,45,25,.35), 0 2px 8px rgba(60,45,25,.05);
  }
  .lock{
    width:52px; height:52px; margin:0 auto 18px; border-radius:15px;
    display:grid; place-items:center;
    background:linear-gradient(160deg,#fdf6e9,#f3e7d2); border:1px solid #ecdfc7;
    box-shadow:0 6px 14px -8px rgba(139,106,63,.55);
  }
  h1{margin:0 0 8px; font-size:19px; letter-spacing:.01em; font-weight:700}
  .sub{margin:0 0 24px; font-size:13px; line-height:1.7; color:var(--ink2)}
  .sub b{color:var(--gold); font-weight:600}
  .field{position:relative}
  input{
    width:100%; height:52px; border-radius:13px; border:1px solid var(--line);
    background:#fff; padding:0 16px 0 46px; font-size:17px; letter-spacing:.42em;
    color:var(--ink); outline:none; transition:border-color .18s, box-shadow .18s;
    font-family:inherit;
  }
  input::placeholder{letter-spacing:.1em; color:var(--ink3); font-size:14px}
  input:focus{border-color:var(--gold-soft); box-shadow:0 0 0 3px rgba(139,106,63,.12)}
  .field svg{position:absolute; left:15px; top:50%; transform:translateY(-50%); opacity:.42}
  button{
    width:100%; height:50px; margin-top:12px; border:0; border-radius:13px;
    background:linear-gradient(180deg,#8f6e42,#7a5c34); color:#fff8ec;
    font-size:15px; font-weight:600; letter-spacing:.04em; cursor:pointer; font-family:inherit;
    box-shadow:0 10px 20px -12px rgba(90,68,36,.9); transition:transform .12s, filter .18s;
  }
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.62; cursor:default; filter:none}
  .msg{
    min-height:20px; margin:14px 0 0; font-size:12.5px; color:var(--danger);
    opacity:0; transition:opacity .2s; line-height:1.6;
  }
  .msg.on{opacity:1}
  .shake{animation:sk .36s}
  @keyframes sk{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
  }
  .foot{
    margin-top:20px; text-align:center; font-size:11.5px; line-height:1.85; color:var(--ink3);
  }
  .foot span{color:#b9b0a2}
  @media (max-width:420px){
    .card{padding:30px 22px 24px; border-radius:17px}
    h1{font-size:17.5px}
    .sub{font-size:12.5px; margin-bottom:20px}
  }
</style>
</head>
<body>
<div class="box">
  <div class="brand"><i></i>&nbsp;Business Card Archive&nbsp;<i></i></div>
  <div class="card" id="card">
    <div class="lock">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8B6A3F" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="10.5" width="15" height="10.5" rx="2.6"/>
        <path d="M8.2 10.5V7.6a3.8 3.8 0 0 1 7.6 0v2.9"/>
        <circle cx="12" cy="15.6" r="1.3"/>
      </svg>
    </div>
    <h1>访问验证</h1>
    <p class="sub">该档案已<b>整体加密</b>，请输入访问密码<br>解锁后查看 <b>154</b> 家单位 · <b>162</b> 位联系人</p>
    <div class="field">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1b2530" stroke-width="1.8"
           stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2.2"/>
        <path d="M8.6 11V8.4a3.4 3.4 0 0 1 6.8 0V11"/></svg>
      <input id="pw" type="password" inputmode="numeric" autocomplete="off"
             maxlength="12" placeholder="请输入访问密码" aria-label="访问密码" autofocus>
    </div>
    <button id="go">进入档案</button>
    <p class="msg" id="msg"></p>
  </div>
  <p class="foot">内容以 AES-256-GCM 加密存储<br><span>仅供内部使用 · 请勿外传链接与密码</span></p>
</div>

  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var card = document.getElementById("card");
  var busy = false;

  function b64(u8) {
    var s = atob(u8);
    var out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  function fail(text) {
    msg.textContent = text;
    msg.classList.add("on");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    pw.select();
    busy = false;
    go.disabled = false;
    go.textContent = "进入档案";
  }

  async function unlock(password) {
    var raw = b64(DATA_B64);
    var iv = raw.subarray(0, 12);
    var data = raw.subarray(12);
    var base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(SALT_B64), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
    return new TextDecoder("utf-8").decode(buf);
  }

  async function enter() {
    if (busy) return;
    var v = pw.value.trim();
    if (!v) { fail("请输入访问密码"); return; }
    if (!(window.crypto && crypto.subtle)) {
      msg.textContent = "当前环境不支持安全解密，请改用 https 地址或新版浏览器打开。";
      msg.classList.add("on");
      return;
    }
    busy = true;
    go.disabled = true;
    go.textContent = "正在解密…";
    msg.classList.remove("on");
    try {
      var html = await unlock(v);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      fail("密码不正确，请重新输入");
    }
  }

  go.addEventListener("click", enter);
  pw.addEventListener("keydown", function (e) {
    if (e.key === "Enter") enter();
  });
})();
